<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تشغيل البث المباشر</title>
    <style>
        /* تنسيق الحاوية لجعل الفيديو متجاوباً بنسبة 16:9 */
        .video-container {
            position: relative;
            width: 100%;
            max-width: 900px; /* يمكنك تعديل العرض الأقصى حسب رغبتك */
            margin: 20px auto;
            padding-bottom: 56.25%; /* نسبة العرض إلى الارتفاع 16:9 */
            height: 0;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="video-container">
        <iframe src="https://lockpop.net/e/acddd0hlduwa2" 
                allowfullscreen 
                allow="autoplay; encrypted-media; picture-in-picture">
        </iframe>
    </div>

</body>
</html>
