<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <!-- تحديد viewport ليمتد تحت الكاميرا ومنع التكبير -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>روابط التطبيق</title>
    
    <!-- خط كايرو -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700&display=swap" rel="stylesheet">
    
    <!-- مكتبة أيقونات Remix -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />
    
    <style>
        :root {
            --bg-color: #07090e;
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            /* استخدام dvh للأجهزة الحديثة ليأخذ حجم الشاشة الفعلي بالكامل */
            height: 100vh;
            height: 100dvh; 
            overflow-x: hidden; /* منع التمرير يمين ويسار نهائياً */
            background-color: var(--bg-color);
            overscroll-behavior-y: none; /* منع تأثير السحب للتحديث في الهواتف */
        }

        body {
            font-family: 'Cairo', sans-serif;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* تأثيرات الإضاءة المحيطية في الخلفية */
        .glow-circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            z-index: 0; /* خلف العناصر */
            opacity: 0.4;
        }
        .glow-1 {
            top: 5%; right: -10%;
            width: 250px; height: 250px;
            background: #00F5B5;
        }
        .glow-2 {
            bottom: 5%; left: -10%;
            width: 250px; height: 250px;
            background: #6A00FF;
        }

        /* حاوية الأزرار - عمودين */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            width: 100%;
            max-width: 360px;
            /* استخدام المنطقة الآمنة لكي لا تختفي الأزرار خلف كاميرا الهاتف */
            padding-top: max(20px, env(safe-area-inset-top));
            padding-bottom: max(20px, env(safe-area-inset-bottom));
            padding-left: max(20px, env(safe-area-inset-left));
            padding-right: max(20px, env(safe-area-inset-right));
            z-index: 1;
        }

        /* تصميم المربعات (الزجاجي) */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 28px;
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #e2e8f0;
            font-size: 15px;
            font-weight: 700;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            
            /* ---- الإضافات الجديدة لمنع الضغط المطول وإظهار الرابط ---- */
            -webkit-touch-callout: none; 
            -webkit-user-select: none;   
            -khtml-user-select: none;    
            -moz-user-select: none;      
            -ms-user-select: none;       
            user-select: none;           
            -webkit-user-drag: none;     
            /* -------------------------------------------------------- */
        }

        /* زر يمتد بعرض العمودين */
        .card.full-width {
            grid-column: 1 / -1;
            aspect-ratio: auto; 
            height: 150px; 
        }

        /* حاوية الإعلان */
        .ad-container {
            grid-column: 1 / -1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            min-height: 50px;
            overflow: hidden;
            border-radius: 8px;
        }

        /* تصميم الأيقونات */
        .card i {
            font-size: 42px;
            margin-bottom: 12px;
            transition: all 0.3s ease;
        }

        /* ألوان الأيقونات */
        .card.home i { color: #00F5B5; }
        .card.vod i { color: #b764ff; }
        .card.search i { color: #3399FF; }
        .card.settings i { color: #94A3B8; }
        .card.download i { color: #FF3366; }

        /* تأثيرات اللمس */
        .card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-5px);
        }

        .card:hover i {
            transform: scale(1.15) translateY(-3px);
            filter: drop-shadow(0 0 15px currentColor);
        }

        .card:active {
            transform: scale(0.92);
        }
    </style>
</head>
<body>

    <!-- إضاءة الخلفية -->
    <div class="glow-circle glow-1"></div>
    <div class="glow-circle glow-2"></div>

    <!-- شبكة الأزرار -->
    <div class="grid-container">
        
        <!-- الرئيسية -->
        <a href="go:Home2" class="card home">
            <i class="ri-home-smile-fill"></i>
            <span>الرئيسية</span>
        </a>

        <!-- الأفلام -->
        <a href="go:Vod2" class="card vod">
            <i class="ri-movie-2-fill"></i>
            <span>الأفلام</span>
        </a>

        <!-- البحث -->
        <a href="go:search" class="card search">
            <i class="ri-search-eye-line"></i>
            <span>البحث</span>
        </a>

        <!-- الإعدادات -->
        <a href="go:settings" class="card settings">
            <i class="ri-settings-4-fill"></i>
            <span>الإعدادات</span>
        </a>

        <!-- مساحة الإعلان -->
        <div class="ad-container">
            <script>
              atOptions = {
                'key' : '4c36e881cfe896ed1e3d7ae247fec6a1',
                'format' : 'iframe',
                'height' : 50,
                'width' : 320,
                'params' : {}
              };
            </script>
            <script src="https://www.highrevenueformat.com/4c36e881cfe896ed1e3d7ae247fec6a1/invoke.js"></script>
        </div>

        <!-- المشغل (مربعين معاً) -->
        <a href="https://pronewsagency.github.io/Jdol/store.html" class="card download full-width">
            <i class="ri-download-cloud-2-fill"></i>
            <span>تحميل المشغل</span>
        </a>

    </div>

    <!-- كود الجافاسكربت لمنع الضغط المطول نهائياً -->
    <script>
        document.querySelectorAll('.card').forEach(function(element) {
            element.addEventListener('contextmenu', function(e) {
                e.preventDefault(); // منع ظهور القائمة الافتراضية
            });
        });
    </script>

</body>
</html>
