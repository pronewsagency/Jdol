        /* المتغيرات والهوية البصرية */
        :root {

            background: #000; position: relative; transition: opacity 0.3s ease;

        .plyr { width: 100%; height: 100%; border-radius: 20px; }

        /* إعلان البانر */

            border-radius: 15px; border: 1px dashed var(--glass-border); padding: 10px;

        }

        /* 2. قسم الأزرار */
        .action-buttons { display: flex; gap: 15px; align-items: center; justify-content: space-between; }
        .btn-action { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 12px 20px; border-radius: 12px; font-weight: 800; font-size: 15px; text-decoration: none; transition: all 0.3s ease; cursor: pointer; border: none; }

        .btn-download { background: var(--glass-bg); color: var(--text-main); border: 1px solid var(--glass-border); }
        .btn-download:hover { background: rgba(255, 255, 255, 0.1); border-color: var(--c-cyan); transform: translateY(-2px); }

        /* 3. قسم القنوات (تم تحديث الـ CSS للصور) */
        .channels-section { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 20px; padding: 25px; backdrop-filter: blur(10px); }
        .section-title { font-size: 18px; font-weight: 800; color: var(--c-cyan); margin-bottom: 20px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--glass-border); padding-bottom: 10px; }
        .channels-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; }
        .channel-card { background: rgba(0,0,0,0.4); border: 1px solid var(--glass-border); padding: 12px 16px; border-radius: 14px; cursor: pointer; display: flex; align-items: center; gap: 12px; transition: all 0.3s ease; }
        
        /* تنسيق الحاوية الخاصة بصورة الشعار */
        .channel-icon { 
            width: 50px; height: 35px; border-radius: 6px; background: rgba(255,255,255,0.03); 
            display: flex; justify-content: center; align-items: center; padding: 4px; transition: 0.3s; 
        }
        .channel-icon img { 
            width: 100%; height: 100%; object-fit: contain; opacity: 0.6; transition: 0.3s; 
        }
        
        .channel-card h4 { font-size: 15px; font-weight: 700; color: var(--text-muted); transition: 0.3s; }
        .channel-card:hover, .channel-card.active { background: rgba(255, 255, 255, 0.08); border-color: var(--c-blue); transform: translateY(-3px); }
        .channel-card.active .channel-icon { background: rgba(255,255,255,0.1); box-shadow: inset 0 0 10px rgba(0, 119, 255, 0.2); }
        
        /* إضاءة الشعار عند التحديد أو التمرير */
        .channel-card:hover .channel-icon img, .channel-card.active .channel-icon img { opacity: 1; filter: drop-shadow(0px 0px 3px rgba(255, 255, 255, 0.5)); }
        .channel-card.active h4 { color: var(--text-main); }
        
        footer { text-align: center; padding: 30px; border-top: 1px solid var(--glass-border); margin-top: 40px; }

        @media (max-width: 768px) {
            .main-container { padding: 15px 10px; gap: 20px; }
            .channels-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
            .action-buttons { flex-direction: row; gap: 10px; }
            .btn-action { font-size: 13px; padding: 10px 5px; }
        }
    </style>
</head>

    <!-- مكتبات المشغل HLS.js و Plyr -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

    <script>
        // --- إدارة مشغل الفيديو (Plyr + Hls.js) ---
        const video = document.getElementById('my-video');
        
        const player = new Plyr(video, {
            controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'fullscreen'],
            keyboard: { focused: true, global: true },
            tooltips: { controls: true, seek: true }
        });

        let hls; 

        window.onload = () => {
            const firstChannel = document.querySelector('.channel-card');
            if(firstChannel) firstChannel.click();
        };

        async function switchChannel(apiUrl, title, element) {
            const wrapper = document.getElementById('video-container');
            const titleElement = document.getElementById('current-channel-text');
            
            wrapper.style.opacity = '0.5';
            
            document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active'));
            if(element) element.classList.add('active');
            
            titleElement.innerText = title + ' (جاري التحميل...)';

            try {
                const response = await fetch(apiUrl);
                const jsonData = await response.json();
                
                if (jsonData && jsonData.data && jsonData.data.length > 0 && jsonData.data[0].url) {
                    const originalStreamUrl = jsonData.data[0].url;
                    const workerDomain = "https://website.fancy-water-8bf9.workers.dev/";
                    const proxiedStreamUrl = workerDomain + "?stream=" + encodeURIComponent(originalStreamUrl);

                    titleElement.innerText = title;
                    
                    if (hls) {
                        hls.destroy();
                    }

                    if (Hls.isSupported()) {
                        hls = new Hls({
                            maxMaxBufferLength: 30 
                        });
                        hls.loadSource(proxiedStreamUrl);
                        hls.attachMedia(video);
                        hls.on(Hls.Events.MANIFEST_PARSED, function () {
                            player.play();
                        });
                    } 
                    else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                        video.src = proxiedStreamUrl;
                        video.addEventListener('loadedmetadata', function () {
                            player.play();
                        });
                    }
                } else {
                    titleElement.innerText = title + ' (البث غير متوفر حالياً)';
                }
            } catch (error) {
                console.error("خطأ أثناء جلب القناة:", error);
                titleElement.innerText = title + ' (فشل الاتصال)';
            } finally {
                wrapper.style.opacity = '1';
            }
        }
    </script>
